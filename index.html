<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frequência do Aluno</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#161a2b;--mut:#6b7285;--bd:#e0e3ee;--ac:#2563eb;--ok:#16a34a;--bad:#dc2626;--blk:#52525b;--warn:#d97706;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1120;--card:#171b2f;--tx:#e9ecf8;--mut:#98a0b8;--bd:#2a3050;--ac:#5b8cff;--ok:#34d399;--bad:#f87171;--blk:#a1a1aa;--warn:#fbbf24}}
:root[data-theme="dark"]{--bg:#0e1120;--card:#171b2f;--tx:#e9ecf8;--mut:#98a0b8;--bd:#2a3050;--ac:#5b8cff;--ok:#34d399;--bad:#f87171;--blk:#a1a1aa;--warn:#fbbf24}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1280px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
p.sub{margin:0 0 18px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:4px}
textarea,input[type=text]{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit}
textarea{height:130px;resize:vertical;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:10px}
.row .grow{flex:1;min-width:180px}
button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button:hover{filter:brightness(1.08)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);margin-top:10px}
#msg{margin-top:10px;font-size:13px;min-height:18px}
.err{color:var(--bad)}.okm{color:var(--ok)}
.global{border-color:var(--ac)}
.big{font-size:40px;font-weight:800;line-height:1}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--mut)}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:12px;border:1px solid var(--bd)}
.bar>i{display:block;height:100%;background:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mod h3{margin:-8px -8px 0;padding:12px 10px;cursor:grab;user-select:none;border-radius:10px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mod h3:hover{background:var(--bg)}
.mod .pc{font-size:28px;font-weight:800;margin-top:6px}
.x{padding:2px 9px;font-size:16px;color:var(--mut)}
.grip{cursor:grab;color:var(--mut);letter-spacing:-3px;user-select:none;margin-right:6px;font-size:18px}
.mod.over{outline:2px dashed var(--ac)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.blk{color:var(--blk)}
.low{color:var(--bad)}.mid{color:var(--warn)}.hi{color:var(--ok)}
.empty{color:var(--mut);text-align:center;padding:24px}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:12px}
.tw{margin-bottom:12px}
table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:12px}
th,td{border:1px solid var(--bd);padding:6px 5px;text-align:center;white-space:normal;word-break:break-word}
th{background:var(--bg);color:var(--mut);font-weight:600}
td.z{color:var(--mut)}
.rel{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}
.rel h4{margin:0 0 6px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.rr{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}
.rr b{text-align:right}
.rel2{display:flex;flex-direction:column;gap:26px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.tile{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:16px}
.tile span{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
.tile b{font-size:28px;font-weight:800;line-height:1.1}
.tile b.sm{font-size:16px}
.secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:30px 36px}
.sec h4{margin:0 0 8px;font-size:13px;color:var(--ac);text-transform:uppercase;letter-spacing:.06em;padding-bottom:8px;border-bottom:2px solid var(--bd)}
.line{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:15px}
.line:last-child,.mrow:last-child{border-bottom:0}
.line span{color:var(--mut)}
.line b{text-align:right}
.mrow{padding:11px 0;border-bottom:1px solid var(--bd)}
.mrow .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:15px}
.mrow small{color:var(--mut);font-size:12px}
.mrow .bar{margin-top:8px;height:8px}
.badge{display:inline-block;font-style:normal;padding:3px 11px;border-radius:999px;font-size:13px;font-weight:700;background:var(--bg);border:1px solid var(--bd);color:var(--tx)}
.badge.g{color:var(--ok)}.badge.a{color:var(--warn)}.badge.r{color:var(--bad)}
.alert{background:var(--bg);border:1px solid var(--bad);color:var(--bad);border-radius:12px;padding:12px 14px;margin-bottom:20px;font-size:15px}
.alert.okk{border-color:var(--ok);color:var(--ok)}
</style>
</head>
<body>
<main>
<h1>Frequência do Aluno</h1>
<p class="sub">Cole o HTML de cada módulo, clique em <b>Calcular módulo</b> e repita. O total acumulado é atualizado automaticamente.</p>

<div class="card">
  <label for="html">HTML do módulo (copie do portal: Inspecionar → Copy outerHTML)</label>
  <textarea id="html" placeholder="Cole aqui o HTML da linha do tempo do módulo..."></textarea>
  <div class="row">
    <div class="grow" hidden><label for="nome">Nome do módulo</label>
      <input type="text" id="nome" placeholder="Ex.: CTO1"></div>
    <button class="pri" id="calc">Calcular módulo</button>
    <button id="clrtxt">Limpar campo de texto</button>
  </div>
  <div class="chk"><input type="checkbox" id="extra" checked><label for="extra" style="margin:0">Contar "Aula Extra" (reposição) como aula</label></div>
  <div id="msg"></div>
</div>

<div class="tools">
  <button id="copy">Copiar relatório</button>
  <button id="clear">Limpar tudo</button>
</div>

<div id="rel"></div>
<h3 style="margin:20px 0 8px;font-size:15px;color:var(--mut)">Tabela para copiar para a planilha</h3>
<div class="card"><div id="tbl"></div><textarea id="tsv" hidden></textarea><div class="row"><button class="pri" id="cpRow">Copiar linha</button><button id="cpHead">Copiar cabeçalho</button><span id="msg2" style="font-size:13px"></span></div><div id="warn" class="err" style="font-size:13px;margin-top:8px"></div></div>
<div id="out"></div>
</main>

<script>
(function(){
  var mods = [], aluno = {nome:'',idade:'',acesso:''}, tabs = {};
  var $ = function(id){return document.getElementById(id)};

  function cls(el){
    var c = el.getAttribute('class') || '';
    return c;
  }

  function parse(html, contarExtra){
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var items = doc.querySelectorAll('.timeline-middle');
    var pres=0, red=0, blk=0, nome='', votes={}, lastMat='', seq=[];
    items.forEach(function(mid){
      var li = mid.closest('li') || mid.parentElement;
      var title = '';
      var p = li.querySelector('.timeline-box p');
      if (p) title = p.textContent.trim();
      // Matrícula: só serve para detectar o nome do módulo
      if (/^Matr[ií]cula/i.test(title)){
        var t2=title.match(/\b(CKO|CTO|CYO|CY|CP\s?IA|CQ\s?IA|CQ\s?CE)\s?(\d)\b/i); if(t2){var pf=t2[1].toUpperCase().replace(/\s+/g,''); var nm=/(IA|CE)$/.test(pf)?pf.slice(0,2)+' '+pf.slice(2)+' '+t2[2]:pf+t2[2]; votes[nm]=(votes[nm]||0)+1;} lastMat=title;
        if(!nome){ var m = title.match(/-\s*([A-Za-z0-9 ]+?)\s*\//); if(m) nome = m[1].trim(); }
        return;
      }
      var svg = mid.querySelector('svg');
      if(!svg) return;
      if(!contarExtra && /^Aula Extra/i.test(title)) return;
      var c = cls(svg);
      if (/text-success/.test(c)) { pres++; seq.push(0); }
      else if (/text-error/.test(c)) { red++; seq.push(1); }
      else if (/text-neutral/.test(c)) { blk++; seq.push(1); }
    });
var best=''; if(lastMat){ var tl=lastMat.match(/\b(CKO|CK|CTO|CT|CYO|CY|CP\s?IA|CQ\s?IA|CQ\s?CE)\s?(\d)\b/i); var cp=lastMat.match(/ctrl\s*pro\D*?(\d)/i); if(tl){ var pf2=tl[1].toUpperCase().replace(/\s+/g,''); best=/(IA|CE)$/.test(pf2)?pf2.slice(0,2)+' '+pf2.slice(2)+' '+tl[2]:(/^(CK|CT|CY)$/.test(pf2)?pf2+'O':pf2)+tl[2]; } else if(cp){ best='CP IA '+cp[1]; } else { var ml=lastMat.match(/-\s*([A-Za-z0-9 ]+?)\s*\//); if(ml) best=ml[1].trim(); } }
    return {nome:best, seq:seq, info:pageInfo(doc), turma:(lastMat&&lastMat.indexOf('#')>=0?lastMat.substring(lastMat.indexOf('#')).trim():''), prof:(lastMat&&lastMat.indexOf('/')>=0?lastMat.split('/').pop().trim():''), pres:pres, red:red, blk:blk};
  }

  function pct(p,t){ return t ? (p/t*100) : 0; }
  function fmt(n){ return n.toFixed(1).replace('.',',') + '%'; }
  function tone(v){ return v>=75 ? 'hi' : (v>=60 ? 'mid' : 'low'); }
  function esc(s){ return s.replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }

  function render(){
    var out = $('out'); sheet();
    if(!mods.length){ out.innerHTML = '<div class="card empty">Nenhum módulo calculado ainda.</div>'; return; }
    var P=0,R=0,B=0;
    mods.forEach(function(m){P+=m.pres;R+=m.red;B+=m.blk;});
    var F=R+B, T=P+F, g=pct(P,T);
    var h = '<div class="card global"><div style="color:var(--mut);font-size:13px">FREQUÊNCIA GERAL ACUMULADA · '+mods.length+' módulo(s)</div>'
      + '<div class="big '+tone(g)+'">'+fmt(g)+'</div>'
      + '<div class="stats"><div class="stat"><b>'+T+'</b><span>aulas</span></div>'
      + '<div class="stat"><b class="ok">'+P+'</b><span>presenças</span></div>'
      + '<div class="stat"><b class="bad">'+F+'</b><span>faltas</span></div></div>'
      + '<div class="bar"><i style="width:'+g+'%"></i></div></div><div class="grid">';
    mods.forEach(function(m,i){
      var f=m.red+m.blk, t=m.pres+f, v=pct(m.pres,t);
      h += '<div class="card mod" data-d="'+i+'"><h3><span>'+esc(m.nome)+'</span><button class="x" data-i="'+i+'" title="Remover">×</button></h3>'
        + '<div class="pc '+tone(v)+'">'+fmt(v)+'</div>'
        + '<div class="stats"><div class="stat"><b>'+t+'</b><span>aulas</span></div>'
        + '<div class="stat"><b class="ok">'+m.pres+'</b><span>presenças</span></div>'
        + '<div class="stat"><b class="bad">'+f+'</b><span>faltas</span></div></div>'
        + '<div style="font-size:12px;color:var(--mut);margin-top:8px">Faltas: <span class="bad">'+m.red+' vermelhas</span> + <span class="blk">'+m.blk+' sem registro</span></div>'
        + '<div class="bar"><i style="width:'+v+'%"></i></div></div>';
    });
    out.innerHTML = h + '</div>';
  }

  var ORDER=['CKO1','CKO2','CKO3','CKO4','CTO1','CTO2','CTO3','CTO4','CYO1','CYO2','CYO3','CYO4','CP IA 1','CP IA 2'];
  function key(n){var k=n.toUpperCase().replace(/\s+/g,''); return k.replace(/^(CK|CT|CY)(\d)$/,'$1O$2');}
  function sheet(){
    var keys=ORDER.map(key), by={}, extra=[], P=0, T=0;
    mods.forEach(function(m){
      P+=m.pres; T+=m.pres+m.red+m.blk;
      var k=key(m.nome);
      if(keys.indexOf(k)<0){extra.push(m.nome);return;}
      by[k]=m;
    });
    var idx=[]; keys.forEach(function(k,i){if(by[k])idx.push(i);});
    var LM=mods.length?mods[mods.length-1]:null, LP=LM?LM.pres:0, LF=LM?LM.red+LM.blk:0;
    var rn=runs(), st=statsOf(keys,by), hasTabs=Object.keys(tabs).length>0;
    var dn=hasTabs?mods.filter(function(m){return tabs[key(m.nome)]==='ok';}).length:'';
    var an=hasTabs?mods.filter(function(m){return tabs[key(m.nome)]==='andamento';}).map(function(m){return m.nome;}).join(', '):'';
    var why=[]; if(T&&pct(P,T)<70) why.push('frequência total abaixo de 70%'); if(rn[1]>=3) why.push(rn[1]+' faltas seguidas no momento'); if(/^Caindo muito/.test(st[2])) why.push('tendência caindo muito');
    var att=why.length?'Sim ('+why.join('; ')+')':'Não';
    function f(m){return fmt(pct(m.pres,m.pres+m.red+m.blk));}
    var cells=[
      aluno.nome, aluno.idade, aluno.acesso, T?fmt(pct(P,T)):'0%', T, P, T-P, LP+LF, LP, LF, rn[0], rn[1], mods.length, dn, an,
      mods.length?f(mods[0]):'0%',
      mods.length?f(mods[mods.length-1]):'0%'
    ].concat(st, [att], keys.map(function(k){return by[k]?f(by[k]):'0%';}), keys.map(function(k){return by[k]?(by[k].prof||''):'';}), trocas(keys,by));
    $('tsv').value=cells.join('\t');
    var head=headAll(), h='', n=Math.max(3,Math.min(12,Math.floor(($('tbl').clientWidth||900)/95)));
    for(var s=0;s<head.length;s+=n){
      h+='<div class="tw"><table><thead><tr>'+head.slice(s,s+n).map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr></thead><tbody><tr>'+cells.slice(s,s+n).map(function(x){return '<td'+(x==='0%'?' class="z"':'')+'>'+x+'</td>';}).join('')+'</tr></tbody></table></div>';
    }
    $('tbl').innerHTML=h;
    renderRel(head,cells,by);
    $('warn').textContent=extra.length?('Fora da sequência (entram só no total): '+extra.join(', ')):'';
  }
  function statsOf(keys, by){
    var v=[]; mods.forEach(function(m){ if(keys.indexOf(key(m.nome))>=0) v.push(pct(m.pres,m.pres+m.red+m.blk)); });
    if(!v.length) return ['0%','0%','Sem dados'];
    var avg=v.reduce(function(a,b){return a+b;},0)/v.length;
    var s=v.slice().sort(function(a,b){return a-b;}), h=Math.floor(s.length/2);
    var med=s.length%2?s[h]:(s[h-1]+s[h])/2;
    var tr='Sem dados';
    if(v.length>1){
      var mx=(v.length-1)/2, num=0, den=0;
      v.forEach(function(y,i){num+=(i-mx)*(y-avg);den+=(i-mx)*(i-mx);});
      var sl=num/den;
      var lab=sl>=8?'Subindo muito':sl>=2?'Subindo':sl>-2?'Estável':sl>-8?'Caindo':'Caindo muito';
      tr=lab+' ('+(sl>0?'+':'')+sl.toFixed(1).replace('.',',')+' p.p.)';
    }
    return [fmt(avg),fmt(med),tr];
  }
  function headAll(){return ['Aluno','Idade','Último acesso ao portal','Freq. total','Aulas totais','Presenças totais','Faltas totais','Aulas do último módulo','Presenças do último módulo','Faltas do último módulo','Maior sequência de faltas','Faltas seguidas atuais','Módulos feitos','Módulos concluídos','Módulos em andamento','Freq. primeiro módulo','Freq. último módulo','Frequência média dos módulos','Frequência mediana dos módulos','Tendência','Atenção'].concat(ORDER, ORDER.map(function(o){return 'Professor do módulo '+o;}), ['Penúltimo professor','Último professor','Trocou de professor','Trocou de professor (penúltimo → último módulo)','Penúltimo horário','Último horário','Trocou de horário (penúltimo → último módulo)','Penúltimo turno','Último turno','Trocou de turno (penúltimo → último módulo)','Penúltimo dia da semana','Último dia da semana','Trocou de dia da semana (penúltimo → último módulo)','Trocou de categoria','Categorias trocadas','Última categoria','Penúltimo ID da turma','Último ID da turma','Penúltimo mês de início','Último mês de início','Penúltimo módulo feito','Último módulo feito','Turma do penúltimo módulo','Turma do último módulo']);}
  function runs(){
    var mx=0, cur=0;
    mods.forEach(function(m,i){ var c=0, mm=0; (m.seq||[]).forEach(function(x){ if(x){c++; if(c>mm) mm=c;} else c=0; }); if(mm>mx) mx=mm; if(i===mods.length-1) cur=c; });
    return [mx,cur];
  }
  function pageInfo(doc){
    var o={nome:'',idade:'',acesso:'',tabs:{}};
    var row=doc.querySelector('tr[data-testid="trTestFilter"]');
    if(row){
      var sb=row.querySelector('div[data-testid^="student"]');
      if(sb){ var ps=sb.querySelectorAll('p'); if(ps[0]) o.nome=ps[0].textContent.trim(); if(ps[1]){ var a=ps[1].textContent.match(/\d+/); if(a) o.idade=a[0]; } }
      var ll=row.querySelector('[data-testid="lastLogin"] p'); if(ll) o.acesso=ll.textContent.trim();
    }
    doc.querySelectorAll('[role="tab"]').forEach(function(t){
      var p=t.querySelector('p'), d=t.querySelector('path'); if(!p||!d) return;
      var dd=d.getAttribute('d')||'';
      o.tabs[key(p.textContent.trim())]=/^m4\.5 12\.75/.test(dd)?'ok':(/^M12 6v6/.test(dd)?'andamento':'');
    });
    return o;
  }
  function nrm(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();}
  function report(head,cells,by){
    var el=$('rel');
    if(!mods.length){ el.innerHTML=''; return; }
    var M={}; head.forEach(function(k,i){M[k]=cells[i];});
    var two=mods.length>1, inSeq=Object.keys(by).length>0;
    var last=mods[mods.length-1], lt=last.pres+last.red+last.blk, S=[];
    S.push(['Frequência',[
      ['Frequência total',M['Freq. total']],
      ['Aulas totais',M['Aulas totais']],
      ['Presenças totais',M['Presenças totais']],
      ['Faltas totais',M['Faltas totais']],
      ['Média de frequência dos módulos',inSeq?M['Média dos módulos']:''],
      ['Tendência',M['Tendência']==='Sem dados'?'':M['Tendência']]
    ]]);
    S.push(['Último módulo',[
      ['Módulo',last.nome],
      ['Frequência no módulo',fmt(pct(last.pres,lt))],
      ['Aulas',lt],['Presenças',last.pres],['Faltas',last.red+last.blk]
    ]]);
    S.push(['Módulos cursados',mods.map(function(m){ var t=m.pres+m.red+m.blk; return [m.nome, fmt(pct(m.pres,t))+' ('+m.pres+' de '+t+' aulas)']; })]);
    S.push(['Professor e turma atuais',[
      ['Professor atual',M['Último professor']],
      ['Turma atual',M['Último ID da turma']?(M['Último ID da turma']+' ('+last.nome+')'):'']
    ]]);
    if(two) S.push(['Mudanças do penúltimo para o último módulo',[
      ['Trocou de professor',M['Trocou de professor (penúltimo → último módulo)']],
      ['Trocou de horário',M['Trocou de horário (penúltimo → último módulo)']],
      ['Trocou de turno',M['Trocou de turno (penúltimo → último módulo)']],
      ['Trocou de dia da semana',M['Trocou de dia da semana (penúltimo → último módulo)']],
      ['Trocou de professor em algum módulo',M['Trocou de professor']]
    ]]);
    var html='';
    S.forEach(function(s){
      var rows=s[1].filter(function(r){return r[1]!==''&&r[1]!=null;});
      if(!rows.length) return;
      html+='<div><h4>'+esc(s[0])+'</h4>'+rows.map(function(r){return '<div class="rr"><span>'+esc(String(r[0]))+'</span><b>'+esc(String(r[1]))+'</b></div>';}).join('')+'</div>';
    });
    el.innerHTML='<div class="card"><h3 style="margin:0 0 14px;font-size:17px">Relatório do aluno</h3><div class="rel">'+html+'</div></div>';
  }
  var relTxt='';
  function yn(l,v){return {l:l,v:v,yn:true};}
  function copyRel(){
    if(!relTxt){ msg('Nada para copiar.', false); return; }
    try{ navigator.clipboard.writeText(relTxt).then(function(){msg('Relatório copiado.',true);}, function(){window.prompt('Copie o relatório:',relTxt);}); }
    catch(e){ window.prompt('Copie o relatório:',relTxt); }
  }
  function renderRel(head,cells,by){
    var el=$('rel');
    if(!mods.length){ el.innerHTML=''; relTxt=''; return; }
    var M={}; head.forEach(function(k,i){M[k]=cells[i];});
    var two=mods.length>1, inSeq=Object.keys(by).length>0;
    var last=mods[mods.length-1], lt=last.pres+last.red+last.blk;
    var tr=M['Tendência'], trOk=!!tr&&tr!=='Sem dados';
    var gp=pct(M['Presenças totais'],M['Aulas totais']);
    var sub=[aluno.nome?'Relatório do aluno':'', aluno.idade?aluno.idade+' anos':'', aluno.acesso?'último acesso ao portal: '+aluno.acesso:''].filter(Boolean).join(' · ');
    var at=M['Atenção'], alertHtml=at==='Não'?'<div class="alert okk">Sem alertas de atenção</div>':'<div class="alert"><b>Atenção:</b> '+esc(at.replace(/^Sim \(/,'').replace(/\)$/,''))+'</div>';
    var tiles='<div class="tile"><span>Frequência total</span><b class="'+tone(gp)+'">'+esc(String(M['Freq. total']))+'</b></div>';
    if(inSeq) tiles+='<div class="tile"><span>Frequência média dos módulos</span><b>'+esc(String(M['Frequência média dos módulos']))+'</b></div>';
    if(trOk){ var tc=/^Subindo/.test(tr)?'g':(/^Caindo muito/.test(tr)?'r':(/^Caindo/.test(tr)?'a':'')); tiles+='<div class="tile"><span>Tendência</span><b class="sm"><em class="badge '+tc+'">'+esc(tr)+'</em></b></div>'; }
    tiles+='<div class="tile"><span>Módulos feitos</span><b>'+M['Módulos feitos']+'</b></div>';
    var S=[];
    S.push({t:'Aulas',r:[{l:'Aulas totais',v:M['Aulas totais']},{l:'Presenças totais',v:M['Presenças totais']},{l:'Faltas totais',v:M['Faltas totais']}]});
    S.push({t:'Último módulo ('+last.nome+')',r:[{l:'Frequência',v:fmt(pct(last.pres,lt))},{l:'Aulas',v:lt},{l:'Presenças',v:last.pres},{l:'Faltas',v:last.red+last.blk}]});
    S.push({t:'Faltas em sequência',r:[{l:'Maior sequência de faltas (histórico)',v:M['Maior sequência de faltas']},{l:'Faltas seguidas no momento',v:M['Faltas seguidas atuais']}]});
    S.push({t:'Módulos cursados',r:mods.map(function(m){var t=m.pres+m.red+m.blk,p=pct(m.pres,t);return {l:m.nome,v:fmt(p),sub:m.pres+' de '+t+' aulas'+(tabs[key(m.nome)]==='ok'?' · concluído':(tabs[key(m.nome)]==='andamento'?' · em andamento':'')),p:p};})});
    S.push({t:'Professores e turma atual',r:[{l:'Professor atual',v:M['Último professor']},{l:'Professor anterior',v:M['Penúltimo professor']},{l:'Turma atual',v:M['Último ID da turma']?M['Último ID da turma']+' ('+last.nome+')':''}]});
    if(two) S.push({t:'Mudanças do penúltimo para o último módulo',r:[
      yn('Trocou de professor',M['Trocou de professor (penúltimo → último módulo)']),
      yn('Trocou de horário',M['Trocou de horário (penúltimo → último módulo)']),
      yn('Trocou de turno',M['Trocou de turno (penúltimo → último módulo)']),
      yn('Trocou de dia da semana',M['Trocou de dia da semana (penúltimo → último módulo)']),
      yn('Trocou de professor em algum módulo',M['Trocou de professor'])
    ]});
    var sh='', tx=['RELATÓRIO DO ALUNO'+(aluno.nome?' - '+aluno.nome:''),aluno.idade?'Idade: '+aluno.idade+' anos':'',aluno.acesso?'Último acesso ao portal: '+aluno.acesso:'','','Frequência total: '+M['Freq. total']];
    if(inSeq) tx.push('Frequência média dos módulos: '+M['Frequência média dos módulos']);
    if(trOk) tx.push('Tendência: '+tr);
    tx.push('Módulos feitos: '+M['Módulos feitos']);
    if(M['Módulos concluídos']!=='') tx.push('Módulos concluídos: '+M['Módulos concluídos']);
    tx.push('Atenção: '+M['Atenção']);
    S.forEach(function(s){
      var rows=s.r.filter(function(r){return r.v!==''&&r.v!=null;});
      if(!rows.length) return;
      sh+='<div class="sec"><h4>'+esc(s.t)+'</h4>';
      tx.push('',s.t.toUpperCase());
      rows.forEach(function(r){
        var v=String(r.v);
        if(r.p!==undefined){
          sh+='<div class="mrow"><div class="top"><b>'+esc(r.l)+'</b><span><b>'+esc(v)+'</b> <small>('+esc(r.sub)+')</small></span></div><div class="bar"><i style="width:'+r.p+'%;background:'+(r.p>=75?'var(--ok)':(r.p>=60?'var(--warn)':'var(--bad)'))+'"></i></div></div>';
          tx.push(r.l+': '+v+' ('+r.sub+')');
        } else if(r.yn){
          sh+='<div class="line"><span>'+esc(r.l)+'</span><b><em class="badge'+(v==='Sim'?' a':'')+'">'+esc(v)+'</em></b></div>';
          tx.push(r.l+': '+v);
        } else {
          sh+='<div class="line"><span>'+esc(r.l)+'</span><b>'+esc(v)+'</b></div>';
          tx.push(r.l+': '+v);
        }
      });
      sh+='</div>';
    });
    relTxt=tx.filter(function(x,i){return !(x===''&&(i===0||tx[i-1]===''));}).join('\n');
    el.innerHTML='<div class="card"><h3 style="margin:0 0 4px;font-size:18px">'+esc(aluno.nome||'Relatório do aluno')+'</h3><div style="color:var(--mut);font-size:13px;margin-bottom:16px">'+esc(sub)+'</div>'+alertHtml+'<div class="rel2"><div class="tiles">'+tiles+'</div><div class="secs">'+sh+'</div></div></div>';
  }
  function turno(h){ var m=(h||'').match(/(\d{1,2})/); if(!m) return ''; var x=+m[1]; return x<12?'Manhã':(x<18?'Tarde':'Noite'); }
  function tparts(t){
    var p=(t||'').split('/').map(function(x){return x.trim();});
    var id=(p[0]||'').match(/#\d+/)||(p[0]||'').match(/#\S+/);
    return [p[1]||'', p[2]||'', p[3]||'', id?id[0]:''];
  }
  function trocas(keys,by){
    var seq=[]; keys.forEach(function(k){ if(by[k]&&nrm(by[k].prof)) seq.push(nrm(by[k].prof)); });
    var any=false; for(var i=1;i<seq.length;i++){ if(seq[i]!==seq[i-1]) any=true; }
    var last='Não', n=mods.length;
    if(n>=2){ var a=nrm(mods[n-2].prof), b=nrm(mods[n-1].prof); if(a&&b&&a!==b) last='Sim'; }
    var ds=[]; mods.forEach(function(m){ var p=(m.prof||'').trim(); if(!p) return; if(!ds.length||nrm(ds[ds.length-1])!==nrm(p)) ds.push(p); });
    var tl=mods.length?(mods[mods.length-1].turma||''):'';
    var CAT={CK:'Kids',CT:'Teens',CY:'Young',CP:'Pro'};
    function cat(m){var mm=key(m.nome).match(/^(CK|CT|CY|CP)/); return mm?mm[1]:'';}
    var cc='Não', ul='', uc='';
    if(mods.length){ var lm=mods[mods.length-1]; ul=lm.nome; uc=CAT[cat(lm)]||''; }
    var cp2=[]; mods.forEach(function(m){ var c=cat(m); if(c&&cp2[cp2.length-1]!==c) cp2.push(c); }); var cpath=cp2.length>1?cp2.join('-'):''; if(cpath) cc='Sim';
    var th='Não', tt='Não', td='Não';
    if(mods.length>1){ var h1=tparts(mods[mods.length-2].turma)[2].toLowerCase(), h2=tparts(mods[mods.length-1].turma)[2].toLowerCase(); if(h1&&h2&&h1!==h2) th='Sim'; var u1=turno(h1), u2=turno(h2); if(u1&&u2&&u1!==u2) tt='Sim'; var d1=tparts(mods[mods.length-2].turma)[1].toLowerCase(), d2=tparts(mods[mods.length-1].turma)[1].toLowerCase(); if(d1&&d2&&d1!==d2) td='Sim'; }
    var tp=tparts(tl), pm=mods.length>1?mods[mods.length-2].nome:'', pp=tparts(mods.length>1?mods[mods.length-2].turma:''), ptl=mods.length>1?(mods[mods.length-2].turma||''):'';
    return [ds.length>1?ds[ds.length-2]:'', ds.length?ds[ds.length-1]:'', any?'Sim':'Não', last, pp[2], tp[2], th, turno(pp[2]), turno(tp[2]), tt, pp[1], tp[1], td, cc, cpath, uc, pp[3], tp[3], pp[0], tp[0], pm, ul, ptl, tl];
  }
  window.addEventListener('resize',function(){sheet();});
  function copyTxt(t){
    var s=$('msg2');
    function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(a);s.textContent=ok?'Copiado.':'Não consegui copiar; selecione o texto e use Ctrl+C.';}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){s.textContent='Copiado.';},fb);}else{fb();}
  }
  $('cpRow').onclick=function(){copyTxt($('tsv').value);};
  $('cpHead').onclick=function(){copyTxt(headAll().join('\t'));};

  function msg(t, ok){ var e=$('msg'); e.textContent=t; e.className = ok ? 'okm' : 'err'; }

  $('calc').onclick = function(){
    var html = $('html').value.trim();
    if(!html){ msg('Cole o HTML do módulo primeiro.', false); return; }
    var r = parse(html, $('extra').checked);
    if(r.pres + r.red + r.blk === 0){ msg('Nenhuma aula encontrada. Confira se copiou o HTML da linha do tempo do módulo.', false); return; }
    var nome = $('nome').value.trim() || r.nome || ('Módulo ' + (mods.length+1));
    var idx = mods.findIndex(function(m){return key(m.nome)===key(nome);});
    var item = {nome:nome, prof:r.prof, turma:r.turma, seq:r.seq, pres:r.pres, red:r.red, blk:r.blk};
    var inf=r.info||{};
    if(inf.nome){
      if(aluno.nome && nrm(aluno.nome)!==nrm(inf.nome)){ msg('Esse HTML é de outro aluno ('+inf.nome+'). Clique em Limpar tudo antes de começar um novo aluno.', false); return; }
      aluno={nome:inf.nome, idade:inf.idade, acesso:inf.acesso};
    }
    if(inf.tabs){ for(var tk in inf.tabs){ tabs[tk]=inf.tabs[tk]; } }
    if(idx>=0){ mods[idx]=item; msg('Módulo "'+nome+'" já existia e foi atualizado.', true); }
    else { mods.push(item); msg('Módulo "'+nome+'" adicionado: '+r.pres+' presenças, '+(r.red+r.blk)+' faltas.', true); }
    $('html').value=''; $('nome').value='';
    render();
  };

  $('out').onclick = function(e){
    var i = e.target.getAttribute && e.target.getAttribute('data-i');
    if(i!==null && i!==undefined){ mods.splice(+i,1); render(); }
  };

  var dragI=null, out0=$('out');
  function modOf(e){return e.target.closest ? e.target.closest('.mod') : null;}
  out0.addEventListener('mousedown',function(e){var g=e.target.closest&&e.target.closest('.mod h3'); if(g&&!e.target.closest('.x')){g.closest('.mod').draggable=true;}});
  document.addEventListener('mouseup',function(){document.querySelectorAll('.mod[draggable=true]').forEach(function(c){c.draggable=false;});});
  out0.addEventListener('dragstart',function(e){var c=modOf(e); if(!c||!c.draggable){return;} dragI=+c.getAttribute('data-d'); c.style.opacity='.4'; e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',String(dragI));}catch(x){}});
  out0.addEventListener('dragover',function(e){var c=modOf(e); if(c&&dragI!==null){e.preventDefault(); out0.querySelectorAll('.over').forEach(function(o){o.classList.remove('over');}); c.classList.add('over');}});
  out0.addEventListener('drop',function(e){var c=modOf(e); if(c&&dragI!==null){e.preventDefault(); var to=+c.getAttribute('data-d'); var it=mods.splice(dragI,1)[0]; mods.splice(to,0,it);} dragI=null; render();});
  out0.addEventListener('dragend',function(){dragI=null; render();});

  $('clrtxt').onclick=function(){ $('html').value=''; msg('',true); $('html').focus(); };
  $('clear').onclick = function(){ mods=[]; aluno={nome:'',idade:'',acesso:''}; tabs={}; $('html').value=''; $('nome').value=''; msg('',true); render(); };

  $('copy').onclick = function(){ copyRel(); };
  var oldCopy = function(){
    if(!mods.length){ msg('Nada para copiar.', false); return; }
    var P=0,F=0, lines=[];
    mods.forEach(function(m){
      var f=m.red+m.blk, t=m.pres+f; P+=m.pres; F+=f;
      lines.push(m.nome+': '+m.pres+'/'+t+' presenças ('+fmt(pct(m.pres,t))+'), '+f+' faltas');
    });
    lines.push('GERAL: '+P+'/'+(P+F)+' presenças ('+fmt(pct(P,P+F))+'), '+F+' faltas');
    var txt = lines.join('\n');
    try{ navigator.clipboard.writeText(txt).then(function(){msg('Resumo copiado.',true);}, function(){window.prompt('Copie o resumo:',txt);}); }
    catch(e){ window.prompt('Copie o resumo:',txt); }
  };

  render();
})();
</script>
</body>
